name: Celostatni jizdni rady bez placenych minut
on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Pouze overit jiz zverejnena data webu a mobilni aplikace'
        type: boolean
        default: false
  schedule:
    - cron: '35 0 * * *'
permissions:
  contents: read
concurrency:
  group: publish-national
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      receipt: ${{ steps.delivery.outputs.receipt }}
    env:
      PYTHONPATH: scripts:tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify importers and atomic publication
        run: python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/cache/restore@v4
        if: ${{ !inputs.verify_only }}
        with:
          path: runtime/national-inputs.tar
          key: national-inputs-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: national-inputs-v2-
      - name: Restore verified-source cache from one archive
        if: ${{ !inputs.verify_only }}
        run: python scripts/national_cache.py restore
      - name: Read current publication using a repository-scoped key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: martincholeva-sudo/kolejnik-web
          ref: main
          path: target
          ssh-key: ${{ secrets.KOLEJNIK_PUBLISH_KEY }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /spojeni/data-national/
          fetch-depth: 1
      - run: python scripts/seed_data.py data-national
      - name: Revalidate official sources and build complete shared data
        if: ${{ !inputs.verify_only }}
        run: python scripts/refresh_national_data.py
      - name: Publish identical data to web and installed-app branches
        if: ${{ !inputs.verify_only }}
        run: |
          git -C target config user.name 'Kolejnik data updater'
          git -C target config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/publish_national_refs.py --repo target
      - name: Verify web delivery and installed-app compatibility
        id: delivery
        run: python scripts/verify_channels.py data-national
      - name: Pack public inputs without enumerating them in the cache action
        id: pack-cache
        if: ${{ always() && !inputs.verify_only }}
        continue-on-error: true
        run: python scripts/national_cache.py pack
      - uses: actions/cache/save@v4
        if: ${{ always() && !inputs.verify_only && steps.pack-cache.outcome == 'success' }}
        continue-on-error: true
        with:
          path: runtime/national-inputs.tar
          key: national-inputs-v2-${{ github.run_id }}-${{ github.run_attempt }}

  receipt:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Record the actually verified public delivery
        env:
          PUBLICATION_RECEIPT: ${{ needs.refresh.outputs.receipt }}
        run: |
          python scripts/save_receipt.py
          git config user.name 'Kolejnik publication receipt'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status
          git commit -m 'Record verified timetable delivery'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
